name: Build self-hosted macOS Apple Silicon app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: macOS Apple Silicon
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build unsigned custom-backend DMG
        working-directory: apps/desktop
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
          VITE_API_URL: http://157.90.122.6:3001
          VITE_WS_URL: ws://157.90.122.6:3001
        run: bunx tauri build --target aarch64-apple-darwin --bundles app,dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: open-sunsama-macos-arm64
          path: apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
